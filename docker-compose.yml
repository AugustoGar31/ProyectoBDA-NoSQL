services:
  mongodb:
    image: mongo:latest
    container_name: nexosql_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-augusto}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-password123}
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - nexosql_network

  api:
    build: .
    container_name: nexosql_api
    restart: always
    environment:
      MONGO_URI: mongodb://${MONGO_USER:-augusto}:${MONGO_PASS:-password123}@mongodb:27017/?authSource=admin
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - mongodb
    networks:
      - nexosql_network

volumes:
  mongo_data:

networks:
  nexosql_network:
    driver: bridge
